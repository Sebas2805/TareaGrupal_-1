<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <body>

        <!--Listado de Arboles-->
        <section th:fragment="lista" class="lista">
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-md-12 py-4">
                        <div class="card text-center">
                            <!-- TÍTULO DEL CARD -->
                            <div class="card-header text-center">
                                <h4>Lista de Árboles:</h4>
                            </div>

                            <div class="card-body">
                                <!-- Lista vacía -->
                                <div class="text-center p-2" th:if="${arboles == null or arboles.empty}">
                                    <span>Lista Vacía</span>
                                </div>

                                <!-- Lista de árboles como tarjetas -->
                                <div class="row row-cols-1 row-cols-md-3 g-4" th:if="${arboles != null and !arboles.empty}">
                                    <div class="col" th:each="arbol : ${arboles}">
                                        <div class="card h-100 shadow-sm">
                                            <!-- Imagen -->
                                            <img th:src="@{${arbol.rutaImagen}}" class="card-img-top" alt="Imagen del árbol" style="object-fit: cover; height: 200px;"/>

                                            <div class="card-body">
                                                <h5 class="card-title" th:text="${arbol.nombreComun}">Nombre</h5>
                                                <p class="card-text">
                                                    <strong>Tipo de Flor:</strong> <span th:text="${arbol.tipoFlor}">Flor</span><br/>
                                                    <strong>Altura:</strong> <span th:text="${arbol.alturaPromedio}">Altura</span><br/>
                                                    <strong>Región:</strong> <span th:text="${arbol.regionOrigen}">Región</span>
                                                </p>
                                            </div>

                                            <div class="card-footer d-flex justify-content-between">
                                                <a th:href="@{/arbol/modificar/{id}(id=${arbol.idArbol})}" class="btn btn-sm btn-success">
                                                    <i class="fas fa-pencil-alt"></i> Editar
                                                </a>
                                                <a th:href="@{/arbol/eliminar/{id}(id=${arbol.idArbol})}" class="btn btn-sm btn-danger">
                                                    <i class="fas fa-trash"></i> Eliminar
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div> <!-- Fin de tarjetas -->
                            </div>
                        </div>
                    </div>

                    <!--Banner para el total de arboles-->
                    <div class="col-md-12 py-1 justify-content-center align-items-center">
                        <div class="card text-center bg-light text-white mb-3">
                            <div class="card-body" style="background-color: #E3B77B">
                                <h3 style="color:black">Total de Árboles</h3>
                                <h4 class="fs-2" style="color:black">[[${totalArboles}]]</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>


        <!--Boton para agregar arboles-->
        <section th:fragment="botonesAgregar" class="m-2">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-3 text-center">   
                        <button 
                            type="button" 
                            class="btn btn-success btn-block" 
                            data-bs-toggle="modal" 
                            data-bs-target="#agregarArbol">
                            <i class="fas fa-plus"></i> Agregar Árbol
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section th:fragment="agregarArbol">
            <div id="agregarArbol"
                 class="modal fade"
                 tabindex="-1"
                 aria-labelledby="agregarArbolLabel"
                 aria-hidden="true">
                <div class="modal-dialog modal-md">
                    <div class="modal-content">
                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title w-100 text-center">Agregar Árbol</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>

                        <!--FORM-->
                        <form th:action="@{/arbol/guardar}" th:object="${arbol}" method="POST" class="was-validated" enctype="multipart/form-data">

                            <!--CUERPO MODAL-->
                            <div class="modal-body">
                                <!--OPCIONES-->
                                <div class="mb-3">
                                    <label for="nombreComun">Nombre:</label>
                                    <input type="text" class="form-control" name="nombreComun" required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label for="tipoFlor">Tipo de Flor:</label>
                                    <input type="text" class="form-control" name="tipoFlor" required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label for="durezaMadera">Dureza de la madera:</label>
                                    <input type="text" class="form-control" name="durezaMadera" required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label for="alturaPromedio">Altura promedio:</label>
                                    <input type="text" class="form-control" name="alturaPromedio" required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label for="esperanzaVida">Esperanza de vida:</label>
                                    <input type="text" class="form-control" name="esperanzaVida" required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label for="regionOrigen">Región de origen:</label>
                                    <input type="text" class="form-control" name="regionOrigen" required="true"/>
                                </div>

                                <div class="mb-3">
                                    <label for="imagen">Imagen:</label>
                                    <input class="form-control" type="file" name="imagenFile" onchange="readURL(this);"/>
                                    <img id="blah" src="#" height="200"/>
                                </div>
                            </div>

                            <div class="modal-footer justify-content-center">
                                <button class="btn btn-primary" type="submit">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!--Modificar Arboles -->
        <section th:fragment="editarArbol">
            <div class="container justify-content-center">
                <div class="row justify-content-center">
                    <!-- Formulario -->
                    <div class="col-md-7 py-5">
                        <form method="POST"
                              th:action="@{/arbol/guardar}" 
                              th:object="${arbol}"
                              class="was-validated"
                              enctype="multipart/form-data">

                            <input type="hidden" th:field="*{idArbol}"/>
                            <input type="hidden" th:field="*{rutaImagen}"/>

                            <div class="card">
                                <div class="card-header" style="background-color: #E3B77B">
                                    <h4 class="text-center">Actualizar Árboles</h4>
                                </div>
                                <div class="card-body">
                                    <!-- Campos del formulario -->
                                    <div class="mb-3">
                                        <label for="nombreComun">Nombre común:</label>
                                        <input type="text" class="form-control" th:field="*{nombreComun}" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="tipoFlor">Tipo de flor:</label>
                                        <input type="text" class="form-control" th:field="*{tipoFlor}" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="durezaMadera">Dureza de la madera:</label>
                                        <input type="text" class="form-control" th:field="*{durezaMadera}" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="alturaPromedio">Altura promedio:</label>
                                        <input type="text" class="form-control" th:field="*{alturaPromedio}" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="esperanzaVida">Esperanza de vida:</label>
                                        <input type="text" class="form-control" th:field="*{esperanzaVida}" required />
                                    </div>

                                    <div class="mb-3">
                                        <label for="regionOrigen">Región de origen:</label>
                                        <input type="text" class="form-control" th:field="*{regionOrigen}" required />
                                    </div>
                                    <div class="mb-3"> <label for="imagenFile">
                                            Imagen:</label> <input class="form-control" type="file" name="imagenFile" onchange="readURL(this);" /> 
                                        <img id="blah" th:src="@{${arbol.rutaImagen}}" alt="your image" height="200"/> 
                                    </div>

                                </div>

                            </div>

                            <!-- Botones -->
                            <section th:replace="~{arbol/fragmentos :: botonesEditar}"/>
                        </form>
                    </div>

                </div>
            </div>
        </section>


        <!-- 5 Fragmento que se utiliza en el fragmento anterior -->
        <section th:fragment="botonesEditar">
            <div class="container py-4">
                <div class="row">
                    <div class="col-md-4 d-grid">
                        <a th:href="@{/arbol/listado}" class="btn btn-primary">
                            <i class="fas fa-arrow-left"></i> Volver
                        </a>
                    </div>
                    <div class="col-md-4 d-grid">                                
                        <a th:href="@{/arbol/eliminar/}+${arbol.idArbol}"
                           class="btn btn-danger">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </div>
                    <div class="col-md-4 d-grid">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check"></i> Guardar
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </body>
</html>
